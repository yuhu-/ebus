name: ebus library CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Configure (simulation + tests)
        run: cmake -S . -B build -DEBUS_SIMULATION=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build -j$(nproc) --timeout=10
